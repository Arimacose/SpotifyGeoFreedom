name: Riemann CvS logarithmic-tail structure audit

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-numerics/audit_log_tail_structure.py'
      - 'research/riemann-cvs-notes/EXPLICIT_LOG_TAIL_THEOREM.md'
      - '.github/workflows/riemann-cvs-log-tail-audit.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-numerics/audit_log_tail_structure.py'
      - 'research/riemann-cvs-notes/EXPLICIT_LOG_TAIL_THEOREM.md'
      - '.github/workflows/riemann-cvs-log-tail-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact-audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mpmath==1.3.0 sympy==1.14.0

      - name: Run symbolic and normalization audit
        run: |
          set -euo pipefail
          mkdir -p research/riemann-cvs-numerics/artifacts
          python research/riemann-cvs-numerics/audit_log_tail_structure.py \
            --json-out \
              research/riemann-cvs-numerics/artifacts/log_tail_structure.json

      - name: Check audit status
        run: |
          python - <<'PY'
          import json
          p = (
              'research/riemann-cvs-numerics/artifacts/'
              'log_tail_structure.json'
          )
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          print(json.dumps(d, indent=2))
          if d['status'] != 'PASS':
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-log-tail-structure
          path: >-
            research/riemann-cvs-numerics/artifacts/log_tail_structure.json
