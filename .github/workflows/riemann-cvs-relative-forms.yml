name: Riemann CvS rigorous relative forms

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - research/riemann-cvs-numerics/certify_parity_gap.py
      - research/riemann-cvs-numerics/certify_relative_forms.py
      - .github/workflows/riemann-cvs-relative-forms.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-relative:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - c0: 5
            c1: 7
            N: 20
            prec: 1200
          - c0: 7
            c1: 11
            N: 20
            prec: 1300
          - c0: 11
            c1: 13
            N: 20
            prec: 1300
          - c0: 13
            c1: 17
            N: 20
            prec: 1400
          - c0: 17
            c1: 23
            N: 20
            prec: 1500
          - c0: 23
            c1: 29
            N: 20
            prec: 1500
          - c0: 29
            c1: 50
            N: 20
            prec: 1700
          - c0: 50
            c1: 100
            N: 20
            prec: 2000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install interval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-flint==0.8.0

      - name: Certify relative parity forms
        run: |
          set -euo pipefail
          mkdir -p research/riemann-cvs-numerics/artifacts
          python research/riemann-cvs-numerics/certify_relative_forms.py \
            --c0 ${{ matrix.c0 }} \
            --c1 ${{ matrix.c1 }} \
            --N ${{ matrix.N }} \
            --prec ${{ matrix.prec }} \
            --min-exp -12 \
            --max-exp 12 \
            --iterations 60 \
            --json-out research/riemann-cvs-numerics/artifacts/c${{ matrix.c0 }}_to_c${{ matrix.c1 }}_N${{ matrix.N }}_relative_forms.json

      - name: Show certificate summary
        run: |
          python - <<'PY'
          import json
          import os
          c0 = os.environ['CASE_C0']
          c1 = os.environ['CASE_C1']
          n = os.environ['CASE_N']
          p = f'research/riemann-cvs-numerics/artifacts/c{c0}_to_c{c1}_N{n}_relative_forms.json'
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          def block(name):
              b = d[name]
              return {
                  'gamma_min_lower': b['proved_loewner_comparison']['gamma_min_lower']['decimal'],
                  'gamma_max_upper': b['proved_loewner_comparison']['gamma_max_upper']['decimal'],
                  'condition_upper': b['proved_loewner_comparison']['relative_condition_number_upper_bound']['decimal'],
                  'minimum_termination': b['generalized_minimum']['termination'],
                  'maximum_termination': b['generalized_maximum']['termination'],
              }
          print(json.dumps({
              'status': d['status'],
              'scope': d['scope'],
              'c0': d['c0'],
              'c1': d['c1'],
              'N': d['N'],
              'even': block('even_block'),
              'odd': block('odd_block'),
          }, indent=2))
          PY
        env:
          CASE_C0: ${{ matrix.c0 }}
          CASE_C1: ${{ matrix.c1 }}
          CASE_N: ${{ matrix.N }}

      - name: Upload relative-form certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-c${{ matrix.c0 }}-to-c${{ matrix.c1 }}-N${{ matrix.N }}-relative-forms
          path: research/riemann-cvs-numerics/artifacts/c${{ matrix.c0 }}_to_c${{ matrix.c1 }}_N${{ matrix.N }}_relative_forms.json
          if-no-files-found: error
