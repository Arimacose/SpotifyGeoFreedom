name: Riemann CvS Hermite-residue verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/HermiteResidues.lean'
      - '.github/workflows/riemann-cvs-hermite-residues.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/HermiteResidues.lean'
      - '.github/workflows/riemann-cvs-hermite-residues.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Elaborate module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/HermiteResidues.lean
      - name: Reject placeholders and print axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/HermiteResidues.lean; then
            exit 1
          fi
          cat > /tmp/HermiteResidueAxioms.lean <<'EOF'
          import RiemannCvs.HermiteResidues
          #print axioms RiemannCvs.HermiteResidues.residueTwo
          #print axioms RiemannCvs.HermiteResidues.residueFour
          #print axioms RiemannCvs.HermiteResidues.residueSix
          #print axioms RiemannCvs.HermiteResidues.residueEight
          #print axioms RiemannCvs.HermiteResidues.residueTen
          #print axioms RiemannCvs.HermiteResidues.firstPlusWeight
          #print axioms RiemannCvs.HermiteResidues.firstMinusWeight
          #print axioms RiemannCvs.HermiteResidues.secondPlusWeight
          #print axioms RiemannCvs.HermiteResidues.secondMinusWeight
          #print axioms RiemannCvs.HermiteResidues.firstWeightRatio
          EOF
          lake env lean /tmp/HermiteResidueAxioms.lean | tee hermite-residue-axioms.txt
          if grep -E 'sorryAx' hermite-residue-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-hermite-residue-axioms
          path: research/riemann-cvs-lean/hermite-residue-axioms.txt
