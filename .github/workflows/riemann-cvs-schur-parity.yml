name: Riemann CvS Schur-parity verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SchurParityBudget.lean'
      - '.github/workflows/riemann-cvs-schur-parity.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SchurParityBudget.lean'
      - '.github/workflows/riemann-cvs-schur-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate Schur-parity module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/SchurParityBudget.lean

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/SchurParityBudget.lean; then
            exit 1
          fi
          cat > /tmp/SchurParityAxioms.lean <<'EOF'
          import RiemannCvs.SchurParityBudget
          #print axioms RiemannCvs.SchurParityBudget.schurCorrectedParity
          #print axioms RiemannCvs.SchurParityBudget.productSchurMargin
          #print axioms RiemannCvs.SchurParityBudget.productSchurParity
          #print axioms RiemannCvs.SchurParityBudget.quarticSignalSeventhError
          #print axioms RiemannCvs.SchurParityBudget.quarticSignalSeventhErrorOfBudget
          EOF
          lake env lean /tmp/SchurParityAxioms.lean | tee schur-parity-axioms.txt
          if grep -E 'sorryAx' schur-parity-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-schur-parity-axioms
          path: research/riemann-cvs-lean/schur-parity-axioms.txt
