name: Riemann CvS Lean verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - research/riemann-cvs-lean/**
      - research/riemann-cvs-numerics/**
      - .github/workflows/riemann-cvs-lean.yml
  pull_request:
    branches:
      - main
    paths:
      - research/riemann-cvs-lean/**
      - research/riemann-cvs-numerics/**
      - .github/workflows/riemann-cvs-lean.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 2

    steps:
      - uses: actions/checkout@v4

      - name: Build and independently audit Lean environment
        uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: RiemannCvs
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Reject proof placeholders
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs; then
            echo 'Proof placeholder detected.' >&2
            exit 1
          fi

      - name: Print theorem axiom dependencies
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean RiemannCvs/PrintAxioms.lean | tee axiom-report.txt

      - name: Upload axiom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-axiom-report
          path: research/riemann-cvs-lean/axiom-report.txt
          if-no-files-found: warn

  certify-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install interval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mpmath==1.3.0 python-flint==0.8.0

      - name: Certify c=13, N=20 finite simple-even ordering
        run: |
          set -euo pipefail
          mkdir -p research/riemann-cvs-numerics/artifacts
          python research/riemann-cvs-numerics/certify_parity_gap.py \
            --c 13 \
            --N 20 \
            --prec 900 \
            --threshold 1e-38 \
            --json-out research/riemann-cvs-numerics/artifacts/c13_N20_parity_gap.json

      - name: Show certificate summary
        run: |
          python - <<'PY'
          import json
          p = 'research/riemann-cvs-numerics/artifacts/c13_N20_parity_gap.json'
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          print(json.dumps({
              'status': d['status'],
              'statement': d['statement'],
              'c': d['c'],
              'N': d['N'],
              'threshold': d['threshold'],
              'even_unshifted_inertia': [d['even_unshifted']['n_pos'], d['even_unshifted']['n_neg']],
              'odd_unshifted_inertia': [d['odd_unshifted']['n_pos'], d['odd_unshifted']['n_neg']],
              'even_shifted_inertia': [d['even_shifted']['n_pos'], d['even_shifted']['n_neg']],
              'odd_shifted_inertia': [d['odd_shifted']['n_pos'], d['odd_shifted']['n_neg']],
          }, indent=2))
          PY

      - name: Upload interval certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-c13-N20-parity-gap
          path: research/riemann-cvs-numerics/artifacts/c13_N20_parity_gap.json
          if-no-files-found: error
