name: Riemann CvS fixed-index prolate constants verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateFixedIndexConstants.lean'
      - '.github/workflows/riemann-cvs-prolate-fixed-index.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateFixedIndexConstants.lean'
      - '.github/workflows/riemann-cvs-prolate-fixed-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate fixed-index constants module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/ProlateFixedIndexConstants.lean

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/ProlateFixedIndexConstants.lean; then
            exit 1
          fi
          cat > /tmp/ProlateFixedIndexAxioms.lean <<'EOF'
          import RiemannCvs.ProlateFixedIndexConstants
          #print axioms RiemannCvs.ProlateFixedIndexConstants.defectEightOverFour
          #print axioms RiemannCvs.ProlateFixedIndexConstants.defectTenOverSix
          #print axioms RiemannCvs.ProlateFixedIndexConstants.bandwidthFourthPower
          #print axioms RiemannCvs.ProlateFixedIndexConstants.plusResidueMass
          #print axioms RiemannCvs.ProlateFixedIndexConstants.minusResidueMass
          #print axioms RiemannCvs.ProlateFixedIndexConstants.plusCorrectionConstant
          #print axioms RiemannCvs.ProlateFixedIndexConstants.minusCorrectionConstant
          EOF
          lake env lean /tmp/ProlateFixedIndexAxioms.lean | tee prolate-fixed-index-axioms.txt
          if grep -E 'sorryAx' prolate-fixed-index-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-prolate-fixed-index-axioms
          path: research/riemann-cvs-lean/prolate-fixed-index-axioms.txt
