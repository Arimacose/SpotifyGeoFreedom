name: Riemann CvS Sylvester no-crossing verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SylvesterNoCrossing.lean'
      - '.github/workflows/riemann-cvs-sylvester-no-crossing.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SylvesterNoCrossing.lean'
      - '.github/workflows/riemann-cvs-sylvester-no-crossing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate Sylvester module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/SylvesterNoCrossing.lean

      - name: Reject placeholders and print axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/SylvesterNoCrossing.lean; then
            exit 1
          fi
          cat > /tmp/SylvesterAxioms.lean <<'EOF'
          import RiemannCvs.SylvesterNoCrossing
          #print axioms RiemannCvs.SylvesterNoCrossing.commonEigenvalueForcesBoundaryZero
          #print axioms RiemannCvs.SylvesterNoCrossing.noCommonEigenvalueWhenBoundaryOverlapsNonzero
          EOF
          lake env lean /tmp/SylvesterAxioms.lean | tee sylvester-axioms.txt
          if grep -E 'sorryAx' sylvester-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-sylvester-axioms
          path: research/riemann-cvs-lean/sylvester-axioms.txt
