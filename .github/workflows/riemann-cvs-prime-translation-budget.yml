name: Riemann CvS prime-translation budget verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/PrimeTranslationBudget.lean'
      - '.github/workflows/riemann-cvs-prime-translation-budget.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/PrimeTranslationBudget.lean'
      - '.github/workflows/riemann-cvs-prime-translation-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate prime-translation budget module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/PrimeTranslationBudget.lean

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/PrimeTranslationBudget.lean; then
            exit 1
          fi
          cat > /tmp/PrimeTranslationBudgetAxioms.lean <<'EOF'
          import RiemannCvs.PrimeTranslationBudget
          #print axioms RiemannCvs.PrimeTranslationBudget.weightedPrimeEventBound
          #print axioms RiemannCvs.PrimeTranslationBudget.vonMangoldtTranslationBound
          EOF
          lake env lean /tmp/PrimeTranslationBudgetAxioms.lean | tee prime-translation-budget-axioms.txt
          if grep -E 'sorryAx' prime-translation-budget-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-prime-translation-budget-axioms
          path: research/riemann-cvs-lean/prime-translation-budget-axioms.txt
