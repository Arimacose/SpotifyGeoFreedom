name: Riemann CvS finite parity certificate

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - research/riemann-cvs-numerics/**
      - .github/workflows/riemann-cvs-parity-cert.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install interval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mpmath==1.3.0 python-flint==0.8.0

      - name: Certify c=13, N=20 finite simple-even ordering
        run: |
          set -euo pipefail
          mkdir -p research/riemann-cvs-numerics/artifacts
          python research/riemann-cvs-numerics/certify_parity_gap.py \
            --c 13 \
            --N 20 \
            --prec 900 \
            --threshold 1e-38 \
            --json-out research/riemann-cvs-numerics/artifacts/c13_N20_parity_gap.json

      - name: Show certificate summary
        run: |
          python - <<'PY'
          import json
          p = 'research/riemann-cvs-numerics/artifacts/c13_N20_parity_gap.json'
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          print(json.dumps({
              'status': d['status'],
              'statement': d['statement'],
              'c': d['c'],
              'N': d['N'],
              'threshold': d['threshold'],
              'even_unshifted_inertia': [d['even_unshifted']['n_pos'], d['even_unshifted']['n_neg']],
              'odd_unshifted_inertia': [d['odd_unshifted']['n_pos'], d['odd_unshifted']['n_neg']],
              'even_shifted_inertia': [d['even_shifted']['n_pos'], d['even_shifted']['n_neg']],
              'odd_shifted_inertia': [d['odd_shifted']['n_pos'], d['odd_shifted']['n_neg']],
          }, indent=2))
          PY

      - name: Upload interval certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-c13-N20-parity-gap
          path: research/riemann-cvs-numerics/artifacts/c13_N20_parity_gap.json
          if-no-files-found: error
