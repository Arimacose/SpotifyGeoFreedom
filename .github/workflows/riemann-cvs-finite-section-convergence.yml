name: Riemann CvS finite-section convergence verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/FiniteSectionConvergence.lean'
      - '.github/workflows/riemann-cvs-finite-section-convergence.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/FiniteSectionConvergence.lean'
      - '.github/workflows/riemann-cvs-finite-section-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate finite-section module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/FiniteSectionConvergence.lean

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/FiniteSectionConvergence.lean; then
            exit 1
          fi
          cat > /tmp/FiniteSectionAxioms.lean <<'EOF'
          import RiemannCvs.FiniteSectionConvergence
          #print axioms RiemannCvs.FiniteSectionConvergence.oneSectorFiniteSectionError
          #print axioms RiemannCvs.FiniteSectionConvergence.finiteGapTransfersToFull
          #print axioms RiemannCvs.FiniteSectionConvergence.schurFiniteGapTransfersToFull
          #print axioms RiemannCvs.FiniteSectionConvergence.productFiniteGapMargin
          #print axioms RiemannCvs.FiniteSectionConvergence.productFiniteGapTransfersToFull
          EOF
          lake env lean /tmp/FiniteSectionAxioms.lean | tee finite-section-axioms.txt
          if grep -E 'sorryAx' finite-section-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-finite-section-axioms
          path: research/riemann-cvs-lean/finite-section-axioms.txt
