name: Riemann CvS three-mode Gershgorin verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ThreeModeGershgorin.lean'
      - '.github/workflows/riemann-cvs-three-mode-gershgorin.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ThreeModeGershgorin.lean'
      - '.github/workflows/riemann-cvs-three-mode-gershgorin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate three-mode Gershgorin module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/ThreeModeGershgorin.lean

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/ThreeModeGershgorin.lean; then
            exit 1
          fi
          cat > /tmp/ThreeModeGershgorinAxioms.lean <<'EOF'
          import RiemannCvs.ThreeModeGershgorin
          #print axioms RiemannCvs.ThreeModeGershgorin.crossTermLower
          #print axioms RiemannCvs.ThreeModeGershgorin.crossTermUpper
          #print axioms RiemannCvs.ThreeModeGershgorin.threeModeLower
          #print axioms RiemannCvs.ThreeModeGershgorin.threeModeUpper
          #print axioms RiemannCvs.ThreeModeGershgorin.threeModeCoercivity
          EOF
          lake env lean /tmp/ThreeModeGershgorinAxioms.lean | tee three-mode-gershgorin-axioms.txt
          if grep -E 'sorryAx' three-mode-gershgorin-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-three-mode-gershgorin-axioms
          path: research/riemann-cvs-lean/three-mode-gershgorin-axioms.txt
