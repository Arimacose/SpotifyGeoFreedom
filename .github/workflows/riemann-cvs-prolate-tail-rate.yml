name: Riemann CvS prolate-tail-rate verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateTailRate.lean'
      - '.github/workflows/riemann-cvs-prolate-tail-rate.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateTailRate.lean'
      - '.github/workflows/riemann-cvs-prolate-tail-rate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Elaborate module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/ProlateTailRate.lean
      - name: Reject placeholders and print axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/ProlateTailRate.lean; then
            exit 1
          fi
          cat > /tmp/ProlateTailRateAxioms.lean <<'EOF'
          import RiemannCvs.ProlateTailRate
          #print axioms RiemannCvs.ProlateTailRate.lambdaSevenCorrectionCertificate
          #print axioms RiemannCvs.ProlateTailRate.finiteTailCorrectionCertificate
          EOF
          lake env lean /tmp/ProlateTailRateAxioms.lean | tee prolate-tail-rate-axioms.txt
          if grep -E 'sorryAx' prolate-tail-rate-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-prolate-tail-rate-axioms
          path: research/riemann-cvs-lean/prolate-tail-rate-axioms.txt
