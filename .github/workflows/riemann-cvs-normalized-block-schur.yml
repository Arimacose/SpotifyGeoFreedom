name: Riemann CvS normalized block-Schur verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/NormalizedBlockSchur.lean'
      - '.github/workflows/riemann-cvs-normalized-block-schur.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/NormalizedBlockSchur.lean'
      - '.github/workflows/riemann-cvs-normalized-block-schur.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate normalized block-Schur module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/NormalizedBlockSchur.lean

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/NormalizedBlockSchur.lean; then
            exit 1
          fi
          cat > /tmp/NormalizedBlockSchurAxioms.lean <<'EOF'
          import RiemannCvs.NormalizedBlockSchur
          #print axioms RiemannCvs.NormalizedBlockSchur.normalizedBlockLowerBound
          #print axioms RiemannCvs.NormalizedBlockSchur.normalizedBlockSchurBound
          #print axioms RiemannCvs.NormalizedBlockSchur.normalizedBlockTargetOfProductBudgets
          EOF
          lake env lean /tmp/NormalizedBlockSchurAxioms.lean | tee normalized-block-schur-axioms.txt
          if grep -E 'sorryAx' normalized-block-schur-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-normalized-block-schur-axioms
          path: research/riemann-cvs-lean/normalized-block-schur-axioms.txt
