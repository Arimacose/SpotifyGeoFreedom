name: Riemann CvS Schur-form verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SchurQuadraticForm.lean'
      - '.github/workflows/riemann-cvs-schur-form.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SchurQuadraticForm.lean'
      - '.github/workflows/riemann-cvs-schur-form.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate Schur-form module
        working-directory: research/riemann-cvs-lean
        run: lake env lean RiemannCvs/SchurQuadraticForm.lean

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/SchurQuadraticForm.lean; then
            exit 1
          fi
          cat > /tmp/SchurFormAxioms.lean <<'EOF'
          import RiemannCvs.SchurQuadraticForm
          #print axioms RiemannCvs.SchurQuadraticForm.squareCompletionMul
          #print axioms RiemannCvs.SchurQuadraticForm.squareCompletion
          #print axioms RiemannCvs.SchurQuadraticForm.schurFormLowerBound
          #print axioms RiemannCvs.SchurQuadraticForm.schurUnitLowerBound
          #print axioms RiemannCvs.SchurQuadraticForm.parityFromSchurLowerBound
          #print axioms RiemannCvs.SchurQuadraticForm.divisionFreeParityMargin
          EOF
          lake env lean /tmp/SchurFormAxioms.lean | tee schur-form-axioms.txt
          if grep -E 'sorryAx' schur-form-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-schur-form-axioms
          path: research/riemann-cvs-lean/schur-form-axioms.txt
