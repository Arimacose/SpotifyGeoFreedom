name: Riemann CvS fixed-Hermite tail-anchor verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/HermiteTailAnchor.lean'
      - '.github/workflows/riemann-cvs-hermite-tail-anchor.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/HermiteTailAnchor.lean'
      - '.github/workflows/riemann-cvs-hermite-tail-anchor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.HermiteTailAnchor
      - name: Reject placeholders and print axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/HermiteTailAnchor.lean; then
            exit 1
          fi
          cat > /tmp/HermiteTailAxioms.lean <<'EOF'
          import RiemannCvs.HermiteTailAnchor
          #print axioms RiemannCvs.HermiteTailAnchor.twelve_le_pi_mul_sq
          #print axioms RiemannCvs.HermiteTailAnchor.plusPoly_nonneg
          #print axioms RiemannCvs.HermiteTailAnchor.minusPoly_leading_lower
          #print axioms RiemannCvs.HermiteTailAnchor.minusPoly_pos
          #print axioms RiemannCvs.HermiteTailAnchor.six_sqrt_thirty_lt_eleven_pi
          #print axioms RiemannCvs.HermiteTailAnchor.scaled_core_ratio
          #print axioms RiemannCvs.HermiteTailAnchor.core_ratio
          #print axioms RiemannCvs.HermiteTailAnchor.normalized_constant_margin
          #print axioms RiemannCvs.HermiteTailAnchor.normalized_constant_exact
          #print axioms RiemannCvs.HermiteTailAnchor.square_three_quarters
          EOF
          lake env lean /tmp/HermiteTailAxioms.lean | tee hermite-tail-axioms.txt
          if grep -E 'sorryAx' hermite-tail-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-hermite-tail-axioms
          path: research/riemann-cvs-lean/hermite-tail-axioms.txt
