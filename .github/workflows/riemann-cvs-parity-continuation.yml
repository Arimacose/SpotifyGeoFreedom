name: Riemann CvS parity-continuation verification

on:
  push:
    branches:
      - research/riemann-cvs-lean-v3
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ParityOrderContinuation.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryGapNoCrossing.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/FourierInversionBridge.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ParityProjection.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/CompressedParityProjection.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SylvesterNoCrossing.lean'
      - '.github/workflows/riemann-cvs-parity-continuation.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ParityOrderContinuation.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryGapNoCrossing.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/FourierInversionBridge.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ParityProjection.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/CompressedParityProjection.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SylvesterNoCrossing.lean'
      - '.github/workflows/riemann-cvs-parity-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate parity bridge modules
        working-directory: research/riemann-cvs-lean
        run: |
          set -euo pipefail
          lake env lean RiemannCvs/SylvesterNoCrossing.lean
          lake env lean RiemannCvs/ParityOrderContinuation.lean
          lake env lean RiemannCvs/BoundaryGapNoCrossing.lean
          lake env lean RiemannCvs/FourierInversionBridge.lean
          lake env lean RiemannCvs/ParityProjection.lean
          lake env lean RiemannCvs/CompressedParityProjection.lean

      - name: Reject placeholders and print axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/SylvesterNoCrossing.lean \
            RiemannCvs/ParityOrderContinuation.lean \
            RiemannCvs/BoundaryGapNoCrossing.lean \
            RiemannCvs/FourierInversionBridge.lean \
            RiemannCvs/ParityProjection.lean \
            RiemannCvs/CompressedParityProjection.lean; then
            exit 1
          fi
          cat > /tmp/ParityContinuationAxioms.lean <<'EOF'
          import RiemannCvs.SylvesterNoCrossing
          import RiemannCvs.ParityOrderContinuation
          import RiemannCvs.BoundaryGapNoCrossing
          import RiemannCvs.FourierInversionBridge
          import RiemannCvs.ParityProjection
          import RiemannCvs.CompressedParityProjection
          #print axioms RiemannCvs.ParityOrderContinuation.strictOrderPersistsOnIcc
          #print axioms RiemannCvs.ParityOrderContinuation.strictOrderPersistsOnIci
          #print axioms RiemannCvs.ParityOrderContinuation.strictOrderOnIciFromAnyAnchor
          #print axioms RiemannCvs.ParityOrderContinuation.positiveGapPersistsOnIci
          #print axioms RiemannCvs.ParityOrderContinuation.positiveGapOnIciFromAnyAnchor
          #print axioms RiemannCvs.ParityOrderContinuation.compactCertificateAndNoCrossingRay
          #print axioms RiemannCvs.BoundaryGapNoCrossing.boundaryValueNonzeroOfStrictConstraintGap
          #print axioms RiemannCvs.BoundaryGapNoCrossing.noCommonEigenvalueFromConstraintGaps
          #print axioms RiemannCvs.FourierInversionBridge.compressedGradingDefectTransfer
          #print axioms RiemannCvs.FourierInversionBridge.compressedGradingDefectNormBound
          #print axioms RiemannCvs.FourierInversionBridge.compressedPlusDefectNormBound
          #print axioms RiemannCvs.FourierInversionBridge.compressedMinusDefectNormBound
          #print axioms RiemannCvs.ParityProjection.energy_split
          #print axioms RiemannCvs.ParityProjection.evenProjectionEnergyUpper
          #print axioms RiemannCvs.ParityProjection.oddProjectionEnergyUpper
          #print axioms RiemannCvs.CompressedParityProjection.compressedDefectSqBound
          #print axioms RiemannCvs.CompressedParityProjection.compressedDefectSqBudget
          #print axioms RiemannCvs.CompressedParityProjection.compressedPlusProjectionEnergyUpper
          #print axioms RiemannCvs.CompressedParityProjection.compressedMinusProjectionEnergyUpper
          EOF
          lake env lean /tmp/ParityContinuationAxioms.lean | tee parity-continuation-axioms.txt
          if grep -E 'sorryAx' parity-continuation-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-parity-continuation-axioms
          path: research/riemann-cvs-lean/parity-continuation-axioms.txt
